<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCH | The Crunchy Hub Rajkot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080808; color: white; scroll-behavior: smooth; }
        
        .hero-bg {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1514326640560-7d063ef2aed5?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .accent-gold { color: #d4af37; }
        .bg-gold { background-color: #d4af37; }
        
        .food-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .food-card:hover { 
            transform: scale(1.03); 
            border-color: #d4af37;
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.1);
        }

        .category-btn { transition: all 0.3s ease; border: 1px solid rgba(255,255,255,0.1); }
        .category-btn.active { background: #d4af37; color: black; border-color: #d4af37; font-weight: 900; }
        
        .menu-grid { display: none; }
        .menu-grid.active { display: grid; }

        .no-scrollbar::-webkit-scrollbar { display: none; }

        #cart-ui {
            display: none;
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #d4af37;
            color: black;
            padding: 18px 28px;
            border-radius: 50px;
            box-shadow: 0 15px 35px rgba(212, 175, 55, 0.4);
            z-index: 999;
            font-weight: 900;
            border: 2px solid black;
            cursor: pointer;
        }
        #cart-count { background: black; color: white; padding: 2px 10px; border-radius: 50px; font-size: 12px; margin-left: 8px; }

        #cart-drawer {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100%;
            background: #111;
            z-index: 1001;
            transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.8);
            border-left: 1px solid rgba(212, 175, 55, 0.2);
            display: flex;
            flex-direction: column;
        }
        #cart-drawer.open { right: 0; }
        
        #cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <header class="py-4 px-4 md:px-8 flex justify-between items-center border-b border-white/10 bg-black/90 sticky top-0 z-50 backdrop-blur-xl">
        <a href="#" class="flex items-center gap-3">
            <img src="logo.png" alt="TCH Logo" class="h-10 md:h-16 w-auto">
            <div class="hidden sm:block">
                <h1 class="text-lg md:text-xl font-black italic tracking-tighter uppercase">THE <span class="accent-gold">CRUNCHY</span> HUB</h1>
            </div>
        </a>

        <div class="flex items-center gap-2 md:gap-4">
            <!-- FIXED CALL BUTTON -->
            <button onclick="window.location.href='tel:+919054545323'" class="flex items-center gap-2 bg-white/5 border border-white/10 px-3 py-2 rounded-lg hover:bg-gold hover:text-black transition">
                <span class="text-[10px] md:text-xs font-black uppercase">Call to Order</span>
            </button>
            <a href="https://www.google.com/maps/dir/?api=1&destination=THE+CRUNCHY+HUB+-+RAJKOT&destination_place_id=ChIJ2TAXCr3LWTkRZ4IRqsPqdEw" target="_blank" class="flex items-center gap-2 bg-gold text-black px-3 py-2 rounded-lg hover:scale-105 transition">
                <span class="text-[10px] md:text-xs font-black uppercase">Directions</span>
            </a>
        </div>
    </header>

    <div id="cart-overlay" onclick="toggleCart()"></div>
    <div id="cart-drawer">
        <div class="p-6 border-b border-white/10 flex justify-between items-center">
            <h2 class="text-2xl font-black italic accent-gold uppercase">Your Order</h2>
            <button onclick="toggleCart()" class="text-white text-3xl">×</button>
        </div>
        <div id="cart-items-list" class="flex-grow overflow-y-auto p-6 space-y-4 no-scrollbar"></div>
        <div class="p-6 border-t border-white/10 bg-black">
            <div class="flex justify-between text-xl font-black mb-6">
                <span>TOTAL</span>
                <span class="accent-gold" id="cart-total">₹0</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-gold text-black py-4 rounded-xl font-black uppercase text-sm mb-3">Send to WhatsApp</button>
            <button onclick="clearCart()" class="w-full text-gray-500 text-xs uppercase font-bold tracking-widest">Clear All</button>
        </div>
    </div>

    <section class="hero-bg min-h-[40vh] flex flex-col justify-center items-center text-center px-6">
        <h2 class="text-4xl md:text-7xl font-black uppercase italic leading-tight">Level Up Your <br><span class="accent-gold">Taste Buds</span></h2>
    </section>

    <section id="menu-tabs" class="py-6 px-4 sticky top-[73px] md:top-[97px] bg-[#080808] z-40 border-b border-white/5">
        <div class="max-w-6xl mx-auto flex overflow-x-auto gap-3 pb-2 no-scrollbar md:justify-center">
            <button onclick="showCategory('burgers', this)" class="category-btn active px-6 py-3 rounded-xl whitespace-nowrap font-black text-[10px] uppercase">Burgers</button>
            <button onclick="showCategory('sandwiches', this)" class="category-btn px-6 py-3 rounded-xl whitespace-nowrap font-black text-[10px] uppercase">Sandwiches</button>
            <button onclick="showCategory('pizzas', this)" class="category-btn px-6 py-3 rounded-xl whitespace-nowrap font-black text-[10px] uppercase">Pizzas</button>
            <button onclick="showCategory('chicken', this)" class="category-btn px-6 py-3 rounded-xl whitespace-nowrap font-black text-[10px] uppercase">Fried Chicken</button>
            <button onclick="showCategory('sides', this)" class="category-btn px-6 py-3 rounded-xl whitespace-nowrap font-black text-[10px] uppercase">Sides & Drinks</button>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <!-- BURGERS -->

            <script>
                const b_data = [

                    ['Classic Veg.', 49],['Veggie Crunch', 99],['Veg Tandoori', 109],['Periperi Paneer', 119],['Paneer Cheese', 129],['Veg. Crunch Cheese Blast', 149],['Veggie Crunch Double', 129]
                ];
                b_data.forEach(i => document.write(`<div class="food-card p-6 rounded-3xl text-center"><h3 class="font-black text-xs uppercase mb-1">${i[0]}</h3><span class="accent-gold font-black italic">₹${i[1]}</span><button onclick="addToCart('${i[0]}', ${i[1]})" class="w-full mt-4 bg-white text-black py-2 rounded-lg font-black text-[10px] uppercase hover:bg-gold">Add</button></div>`));
            </script>
        </div>

        <!-- SANDWICHES -->
        <div id="sandwiches" class="menu-grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <script>
                const s_data = [
                    ['Chicken Tikka Sandwich', 99],['Peri Peri Chicken Sandwich', 109],['Double Chicken Sandwich', 129],['Crispy Chicken Sandwich', 129],['Grill Chicken Sandwich', 139],['Cheese & Corn Chicken', 179],['TCH Sp. Chicken Pizza Sandwich', 199],
                    ['Veg Grill Sandwich', 99],['Veg Cheese Grill', 129],['Veg Tandoori Panner', 149],['TCH SP. Pizza Sandwich', 199],['Cheesy Golden Corn Sandwich', 149]
                ];
                s_data.forEach(i => document.write(`<div class="food-card p-6 rounded-3xl text-center"><h3 class="font-black text-xs uppercase mb-1">${i[0]}</h3><span class="accent-gold font-black italic">₹${i[1]}</span><button onclick="addToCart('${i[0]}', ${i[1]})" class="w-full mt-4 bg-white text-black py-2 rounded-lg font-black text-[10px] uppercase hover:bg-gold">Add</button></div>`));
            </script>
        </div>

        <!-- PIZZAS -->
        <div id="pizzas" class="menu-grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <script>
                const p_data = [
                    ['Chicken Margherita', 199],['Cheese Chicken Corn', 229],['Indi Chicken Tikka', 219],['Tandoori Chicken Pizza', 249],['Chicken Popcorn Pizza', 249],['Chicken Seekh Pizza', 249],
                    ['Margherita Veg', 149],['Double Cheese Margherita', 199],['Veg Golden Corn', 159],['Paneer Tikka Pizza', 199],['Tandoori Paneer Pizza', 249]
                ];
                p_data.forEach(i => document.write(`<div class="food-card p-6 rounded-3xl text-center"><h3 class="font-black text-xs uppercase mb-1">${i[0]}</h3><span class="accent-gold font-black italic">₹${i[1]}</span><button onclick="addToCart('${i[0]}', ${i[1]})" class="w-full mt-4 bg-white text-black py-2 rounded-lg font-black text-[10px] uppercase hover:bg-gold">Add</button></div>`));
            </script>
        </div>

        <!-- FRIED CHICKEN -->
        <div id="chicken" class="menu-grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <script>
                const ch_data = [
                    ['Popcorn (S)', 149],['Popcorn (L)', 279],['Cheesy Popcorn (S)', 179],['Cheesy Popcorn (L)', 319],['Strips (5pc)', 199],['Strips (12pc)', 399],['Sweet Chilli Strips (5pc)', 219],['Nuggets (6pc)', 119],['Nuggets (12pc)', 219],['Spiced Wings (6pc)', 199],['Chicken Seekh (4pc)', 159],['Masala Chicken Thigh', 149],['Loaded Cheese Thigh', 199]
                ];
                ch_data.forEach(i => document.write(`<div class="food-card p-6 rounded-3xl text-center"><h3 class="font-black text-xs uppercase mb-1">${i[0]}</h3><span class="accent-gold font-black italic">₹${i[1]}</span><button onclick="addToCart('${i[0]}', ${i[1]})" class="w-full mt-4 bg-white text-black py-2 rounded-lg font-black text-[10px] uppercase hover:bg-gold">Add</button></div>`));
            </script>
        </div>

        <!-- SIDES & DRINKS -->
        <div id="sides" class="menu-grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <script>
                const side_data = [
                    ['Salted Fries', 79],['Peri Peri Fries', 89],['Chicken Fries (10pc)', 99],['Cheeeeeesy Fries', 129],['Masala Cheeesy', 139],['Cheeesy Chicken Fries (S)', 249],['Cheeesy Chicken Fries (L)', 499],
                    ['Lava Cake', 99],['Orange Soda', 69],['Blueberry Soda', 69],['Strawberry Soda', 69],['Green Apple Soda', 69],['Coke/Campa (250ml)', 20]
                ];
                side_data.forEach(i => document.write(`<div class="food-card p-6 rounded-3xl text-center"><h3 class="font-black text-xs uppercase mb-1">${i[0]}</h3><span class="accent-gold font-black italic">₹${i[1]}</span><button onclick="addToCart('${i[0]}', ${i[1]})" class="w-full mt-4 bg-white text-black py-2 rounded-lg font-black text-[10px] uppercase hover:bg-gold">Add</button></div>`));
            </script>
        </div>
    </main>

    <div id="cart-ui" onclick="toggleCart()">
        <span>ORDER</span> <span id="cart-count">0</span>
    </div>

    <script>
        let cart = [];
        function toggleCart() {
            const dr = document.getElementById('cart-drawer');
            const ov = document.getElementById('cart-overlay');
            dr.classList.toggle('open');
            ov.style.display = dr.classList.contains('open') ? 'block' : 'none';
            renderCart();
        }
        function showCategory(id, btn) {
            document.querySelectorAll('.menu-grid').forEach(g => g.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            window.scrollTo({ top: document.getElementById('menu-tabs').offsetTop - 20, behavior: 'smooth' });
        }
        function addToCart(name, price) {
            cart.push({ id: Date.now() + Math.random(), name, price });
            updateUI();
        }
        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            updateUI();
            renderCart();
        }
        function updateUI() {
            document.getElementById('cart-ui').style.display = cart.length > 0 ? 'flex' : 'none';
            document.getElementById('cart-count').innerText = cart.length;
        }
        function renderCart() {
            const list = document.getElementById('cart-items-list');
            const totalEl = document.getElementById('cart-total');
            list.innerHTML = ''; let total = 0;
            cart.forEach(item => {
                total += item.price;
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-white/5 p-4 rounded-xl border border-white/10">
                        <p class="text-xs uppercase font-bold">${item.name}</p>
                        <div class="flex items-center gap-4">
                            <p class="accent-gold text-xs italic">₹${item.price}</p>
                            <button onclick="removeItem(${item.id})" class="text-red-500 text-[10px] font-black uppercase hover:text-white">✕</button>
                        </div>
                    </div>`;
            });
            totalEl.innerText = `₹${total}`;
        }
        function sendOrder() {
            let msg = cart.map(i => `${i.name} - ₹${i.price}`).join('\n');
            let total = cart.reduce((s, i) => s + i.price, 0);
            window.open(`https://wa.me/919054545323?text=${encodeURIComponent("New Order From Web:\n\n" + msg + "\n\nTotal: ₹" + total)}`);
        }
        function clearCart() { cart = []; toggleCart(); updateUI(); }
    </script>
</body>
</html>
